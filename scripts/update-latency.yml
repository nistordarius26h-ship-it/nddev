name: Update Real Latency Data

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-latency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run latency measurement script
        run: node scripts/update-latency.mjs

      # Intentionally NOT using [skip ci] here: GitHub Pages serves the built
      # dist/ artifact, and public/ files are copied into dist/ at build
      # time, so this push needs to trigger deploy.yml for the new data to
      # actually reach the live site.
      - name: Commit updated latency.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/latency.json; then
            git add public/latency.json
            git commit -m "chore: update live latency data"
            # main may have moved (e.g. you pushed via the GitHub web UI)
            # between this job's checkout and now — rebase onto the latest
            # before pushing so this never collides. Retries a few times
            # in case of a push race against another concurrent run.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          else
            echo "No latency changes to commit."
          fi
